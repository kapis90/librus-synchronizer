[project]
name = "librus-synchronizer"
version = "0.1.0"
description = "Synchronize librus schedule with google calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gcsa>=2.7.0",
    "librus-apix>=1.6.0",
    "packaging>=26.3",
    "python-dateutil>=3.0.0",
    "retry>=0.9.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.setuptools]
py-modules = ["execute", "google_calendar_wrapper", "librus_synchronizer"]
