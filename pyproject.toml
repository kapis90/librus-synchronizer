[project]
name = "librus-synchronizer"
version = "0.1.0"
description = "Synchronize librus schedule with google calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gcsa>=2.5.1",
    "librus-apix>=1.5.1",
    "packaging>=25.0",
    "python-dateutil>=2.9.0.post0",
    "retry>=0.9.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.10",
]

[tool.setuptools]
py-modules = ["execute", "get_unread_messages", "google_calendar_wrapper", "librus_synchronizer", "logging_config"]
