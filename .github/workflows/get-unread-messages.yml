name: Get Unread Messages

on:
  workflow_dispatch:  # Manual trigger
    inputs:
        resumeUrl:
            description: 'Resume URL'
            required: false
            type: string
        who: 
            description: 'Who to get messages for (Tosia or Dorota)'
            required: true
            options: [Tosia, Dorota]
            type: choice
jobs:
  get-messages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies with uv
        run: uv sync

      - name: Run get_messages script
        id: get_messages
        env:
            LIBRUS_USERNAME: ${{ github.event.inputs.who == 'Tosia' && secrets.LIBRUS_USERNAME_T || secrets.LIBRUS_USERNAME_D }}
            LIBRUS_PASSWORD: ${{ secrets.LIBRUS_PASSWORD }}
        run: |
            # stdout is pure JSON (logs go to stderr); a non-zero exit fails
            # the step so no webhook is sent on error.
            uv run get_unread_messages.py > payload.json
            cat payload.json
            count=$(python3 -c "import json; print(len(json.load(open('payload.json')).get('messages', [])))")
            echo "count=$count" >> "$GITHUB_OUTPUT"
            {
              echo 'payload<<PAYLOAD_JSON_EOF'
              cat payload.json
              echo 'PAYLOAD_JSON_EOF'
            } >> "$GITHUB_OUTPUT"

      - name: Send webhook
        if: steps.get_messages.outputs.count != '0'
        env:
          RESUME_URL: ${{ github.event.inputs.resumeUrl }}
        run: |
            if [ -z "$RESUME_URL" ]; then
              echo "resumeUrl not provided, skipping webhook"
              exit 0
            fi
            curl --fail-with-body -X POST "$RESUME_URL" \
              -H "Content-Type: application/json" \
              --data @payload.json
